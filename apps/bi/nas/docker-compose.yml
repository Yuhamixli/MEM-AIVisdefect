# Synology Container Manager — optional if Web Station is already on :80.
# 1) Copy this folder (with html/) to /docker/mem-aivisdefect-bi
# 2) Container Manager → Project → Create from this compose
# 3) Open http://<NAS-IP>:8088/MEM-AIVisdefect/
services:
  bi:
    image: docker.m.daocloud.io/library/nginx:1.27-alpine
    container_name: mem-aivisdefect-bi
    restart: unless-stopped
    ports:
      - "8088:80"
    volumes:
      - ./html:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    logging:
      driver: json-file
      options:
        max-size: "4m"
        max-file: "2"
