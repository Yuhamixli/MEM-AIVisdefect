name: Push docs to Feishu

# 仓库 → 飞书：main 上文档变更后自动导入/替换云文档，零手工上传。
on:
  push:
    branches: [main, master]
    paths:
      - "docs/design/**"
      - "docs/02-tech-research/**"
      - "docs/project-management/**"
      - "docs/agent-knowledge-base/*.md"
      - "docs/feishu-push-manifest.json"
      - "apps/feishu-cursor-bridge/scripts/push-feishu-docs.ts"
      - ".github/workflows/push-feishu-docs.yml"
  workflow_dispatch:
    inputs:
      force:
        description: "Force re-push all matched files"
        required: false
        default: "false"
        type: boolean

permissions:
  contents: write

concurrency:
  group: push-feishu-docs
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/feishu-cursor-bridge
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/feishu-cursor-bridge/package-lock.json

      - name: Check Feishu secrets
        id: secrets
        env:
          APP_ID: ${{ secrets.FEISHU_APP_ID }}
          APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
        run: |
          if [ -z "$APP_ID" ] || [ -z "$APP_SECRET" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::FEISHU_APP_ID / FEISHU_APP_SECRET 未配置，跳过推送。请在仓库 Settings → Secrets 中添加。"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install
        if: steps.secrets.outputs.configured == 'true'
        run: npm ci

      - name: Push docs
        if: steps.secrets.outputs.configured == 'true'
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_PUSH_FOLDER_TOKEN: ${{ secrets.FEISHU_PUSH_FOLDER_TOKEN }}
          FEISHU_SYNC_FOLDER_TOKEN: ${{ secrets.FEISHU_SYNC_FOLDER_TOKEN }}
        run: |
          EXTRA=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            EXTRA="--force"
          fi
          npm run push-docs -- $EXTRA

      - name: Commit PUSH_STATE
        if: steps.secrets.outputs.configured == 'true'
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "feishu-docs-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/agent-knowledge-base/feishu-sync/PUSH_STATE.json
          if git diff --staged --quiet; then
            echo "No state changes"
            exit 0
          fi
          git commit -m "chore(feishu): update PUSH_STATE after docs push"
          git push
