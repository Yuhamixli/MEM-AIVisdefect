name: Feishu docs bidirectional sync

# 定时对齐：飞书 → 仓库（sync-docs）+ 仓库 → 飞书（push-docs）
# 与 Cursor Automation 互补；Secrets 与 push-feishu-docs 相同。
on:
  schedule:
    # 每天 01:00 UTC = 北京时间 09:00
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      force_push:
        description: "Force re-push all matched repo docs"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: feishu-docs-bidirectional
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/feishu-cursor-bridge
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/feishu-cursor-bridge/package-lock.json

      - name: Check Feishu secrets
        id: secrets
        env:
          APP_ID: ${{ secrets.FEISHU_APP_ID }}
          APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
        run: |
          if [ -z "$APP_ID" ] || [ -z "$APP_SECRET" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::FEISHU_APP_ID / FEISHU_APP_SECRET 未配置，跳过。"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install
        if: steps.secrets.outputs.configured == 'true'
        run: npm ci

      - name: Pull Feishu → repo (sync-docs)
        if: steps.secrets.outputs.configured == 'true'
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_SYNC_FOLDER_TOKEN: ${{ secrets.FEISHU_SYNC_FOLDER_TOKEN }}
        run: npm run sync-docs

      - name: Push repo → Feishu (push-docs)
        if: steps.secrets.outputs.configured == 'true'
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_PUSH_FOLDER_TOKEN: ${{ secrets.FEISHU_PUSH_FOLDER_TOKEN }}
          FEISHU_SYNC_FOLDER_TOKEN: ${{ secrets.FEISHU_SYNC_FOLDER_TOKEN }}
        run: |
          EXTRA=""
          if [ "${{ github.event.inputs.force_push }}" = "true" ]; then
            EXTRA="--force"
          fi
          npm run push-docs -- $EXTRA

      - name: Commit sync artifacts
        if: steps.secrets.outputs.configured == 'true'
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "feishu-docs-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/agent-knowledge-base/feishu-sync
          if git diff --staged --quiet; then
            echo "No sync artifact changes"
            exit 0
          fi
          git commit -m "chore(feishu): scheduled bidirectional docs sync"
          git push
